<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self';"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="description" content="Not a text editor." />
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=5"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="otepad" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="otepad" />
    <link rel="icon" sizes="192x192" href="img/icon-192x192.png" />
    <link rel="apple-touch-icon" href="img/icon-192x192.png" />
    <meta name="msapplication-TileImage" content="img/icon-144x144.png" />
    <meta name="msapplication-TileColor" content="#212124" />
    <meta name="theme-color" content="#212124" />
    <meta name="twitter:creator" content="@GauravNelson" />
    <title>otepad</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" type="text/css" href="css/uikit.min.css" />
    <link rel="stylesheet" type="text/css" href="css/main.css" />
  </head>
  <body>
    <div id="surfaceView" class="surface-view" role="main">
      <header class="surface-header drag">
        <h1 class="surface-brand no-drag">
          <img
            class="brand-logo"
            src="img/icon-96x96.png"
            width="36"
            height="36"
            alt=""
            decoding="async"
          />
          <span>otepad</span>
        </h1>
      </header>
      <div id="padGrid" class="pad-grid no-drag" aria-label="Pads"></div>
      <footer class="surface-footer no-drag">
        <a href="privacy.html">Privacy</a>
        <span class="surface-footer-sep" aria-hidden="true">·</span>
        <a href="terms.html">Terms</a>
        <span class="surface-footer-sep" aria-hidden="true">·</span>
        <a
          href="https://github.com/gaurav-nelson/otepad"
          target="_blank"
          rel="noopener noreferrer"
          >GitHub</a
        >
      </footer>
      <button
        id="addPad"
        class="uk-icon-button control-btn control-btn-add"
        uk-icon="plus"
        uk-tooltip="title: Add pad; pos: left"
        aria-label="Add pad"
        type="button"
      ></button>
      <button
        id="deleteAllPads"
        class="uk-icon-button control-btn control-btn-delete"
        uk-icon="trash"
        uk-tooltip="title: Delete all pads; pos: left"
        aria-label="Delete all pads"
        type="button"
      ></button>
    </div>

    <div id="editorView" class="editor-view" hidden>
      <div id="container" class="container" uk-container uk-height-viewport drag role="main">
        <div class="pad-title-wrap no-drag">
          <button
            type="button"
            id="padTitle"
            class="pad-title"
            aria-label="Rename pad"
            title="Click to rename"
          ></button>
          <input
            id="padTitleInput"
            class="pad-title-input"
            type="text"
            maxlength="60"
            autocomplete="off"
            spellcheck="false"
            aria-label="Pad title"
            hidden
          />
        </div>
        <div
          id="editable"
          class="no-drag editor"
          contenteditable="true"
          role="textbox"
          aria-multiline="true"
          aria-label="Editor"
        ></div>
      </div>
      <button
        id="backToSurface"
        class="uk-icon-button control-btn control-btn-back"
        uk-icon="arrow-left"
        uk-tooltip="title: Back; pos: right"
        aria-label="Back to surface"
        type="button"
      ></button>
      <button
        id="deleteContent"
        class="uk-icon-button control-btn control-btn-delete"
        uk-icon="trash"
        uk-tooltip="title: Delete pad; pos: left"
        aria-label="Delete pad"
        type="button"
      ></button>
    </div>

    <button
      id="toggleTheme"
      class="control-btn control-btn-theme"
      uk-tooltip="title: Switch to dark theme; pos: left"
      aria-label="Switch to dark theme"
      type="button"
    >
      <span id="themeIcon" class="theme-icon" aria-hidden="true"></span>
    </button>

    <div
      id="confirmDialog"
      class="confirm-dialog"
      hidden
      role="dialog"
      aria-modal="true"
      aria-labelledby="confirmDialogTitle"
      aria-describedby="confirmDialogMessage"
    >
      <div class="confirm-dialog-backdrop" data-confirm-cancel></div>
      <div class="confirm-dialog-panel">
        <h2 id="confirmDialogTitle" class="confirm-dialog-title">Delete pad?</h2>
        <p id="confirmDialogMessage" class="confirm-dialog-message"></p>
        <div class="confirm-dialog-actions">
          <button type="button" id="confirmDialogCancel" class="confirm-btn confirm-btn-cancel">
            Cancel
          </button>
          <button type="button" id="confirmDialogConfirm" class="confirm-btn confirm-btn-danger">
            Delete
          </button>
        </div>
      </div>
    </div>
  </body>
  <script src="js/uikit.min.js"></script>
  <script src="js/uikit-icons.min.js"></script>
  <script src="js/main.js"></script>
  <script>
    if (typeof navigator.serviceWorker !== 'undefined') {
      navigator.serviceWorker.register('js/sw.js')
    }
  </script>
</html>
